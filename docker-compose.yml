x-platform-service: &platform-service
  image: tektalk-platform-services:local
  build:
    context: .
    dockerfile: services/platform-services/Dockerfile
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  scylla:
    image: scylladb/scylla:6.2
    command: ["--smp", "1", "--memory", "750M", "--overprovisioned", "1"]
    ports: ["9042:9042"]
    volumes: ["scylla-data:/var/lib/scylla"]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT key FROM system.local' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 30
    restart: unless-stopped
  redpanda:
    image: redpandadata/redpanda:v24.2.12
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "512M", "--reserve-memory", "0M", "--node-id", "0", "--kafka-addr", "PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092", "--advertise-kafka-addr", "PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092"]
    ports: ["19092:19092", "9644:9644"]
    volumes: ["redpanda-data:/var/lib/redpanda/data"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 15s
      retries: 20
    restart: unless-stopped
  server:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat
      REDIS_URL: redis://redis:6379
      BUSINESS_SOLUTIONS_URL: http://business-solutions:50056
      SCYLLA_NODES: scylla:9042
      KAFKA_BROKERS: redpanda:9092
      SNOWFLAKE_NODE_ID: 0
      REALTIME_TCP_BIND: 0.0.0.0:8081
      REALTIME_TCP_PUBLIC: tcp://localhost:8081
      REALTIME_WSS_PUBLIC: ws://localhost:8080/v1/realtime/connect
    ports: ["8080:8080", "8081:8081"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      scylla: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      business-solutions: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  plugin-registry:
    build:
      context: .
      dockerfile: services/plugin-registry/Dockerfile
    environment:
      PLUGIN_REGISTRY_BIND: 0.0.0.0:50051
      RUST_LOG: tektalk_plugin_registry=info
      PLUGIN_SIGNING_SEED: ${PLUGIN_SIGNING_SEED}
      PLUGIN_SIGNING_KEY_ID: ${PLUGIN_SIGNING_KEY_ID:-local-development}
      PLUGIN_ARTIFACT_BASE_URL: ${PLUGIN_ARTIFACT_BASE_URL:-http://localhost:8090}
      PLUGIN_REQUIRE_SIGNED_ARTIFACTS: ${PLUGIN_REQUIRE_SIGNED_ARTIFACTS:-false}
      PLUGIN_ARTIFACT_METADATA_JSON: '${PLUGIN_ARTIFACT_METADATA_JSON:-[]}'
    ports: ["50051:50051"]
    restart: unless-stopped
  signin-signup:
    <<: *platform-service
    command: ["/usr/local/bin/signin-signup"]
    environment:
      SERVICE_BIND: 0.0.0.0:50052
      RUST_LOG: tektalk_platform_services=info
    ports: ["50052:50052"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50052"]
      interval: 5s
      timeout: 3s
      retries: 20
  chat:
    <<: *platform-service
    command: ["/usr/local/bin/chat"]
    environment:
      SERVICE_BIND: 0.0.0.0:50053
      RUST_LOG: tektalk_platform_services=info
      SNOWFLAKE_NODE_ID: 1
    ports: ["50053:50053"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50053"]
      interval: 5s
      timeout: 3s
      retries: 20
  session-management:
    <<: *platform-service
    command: ["/usr/local/bin/session-management"]
    environment:
      SERVICE_BIND: 0.0.0.0:50054
      RUST_LOG: tektalk_platform_services=info
    ports: ["50054:50054"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50054"]
      interval: 5s
      timeout: 3s
      retries: 20
  consent-management:
    <<: *platform-service
    command: ["/usr/local/bin/consent-management"]
    environment:
      SERVICE_BIND: 0.0.0.0:50055
      RUST_LOG: tektalk_platform_services=info
    ports: ["50055:50055"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50055"]
      interval: 5s
      timeout: 3s
      retries: 20
  business-solutions:
    depends_on:
      postgres: {condition: service_healthy}
    build:
      context: .
      dockerfile: services/business-solutions/Dockerfile
    environment:
      SERVICE_BIND: 0.0.0.0:50056
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat
      RUST_LOG: tektalk_business_solutions=info
    ports: ["50056:50056"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50056"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  pg-data:
  redis-data:
  scylla-data:
  redpanda-data:
