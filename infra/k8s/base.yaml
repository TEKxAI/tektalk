apiVersion: v1
kind: ConfigMap
metadata: {name: tektalk-server-config}
data:
  APP_BIND: "0.0.0.0:8080"
  BUSINESS_SOLUTIONS_URL: "http://tektalk-business-solutions:50056"
  RUST_LOG: "chat_server=info,tower_http=info"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tektalk-business-solutions}
spec:
  replicas: 3
  selector: {matchLabels: {app: tektalk-business-solutions}}
  template:
    metadata: {labels: {app: tektalk-business-solutions}}
    spec:
      containers:
        - name: business-solutions
          image: ghcr.io/tekxai/tektalk/business-solutions:latest
          ports: [{name: grpc, containerPort: 50056}]
          env: [{name: SERVICE_BIND, value: "0.0.0.0:50056"}]
          envFrom: [{secretRef: {name: tektalk-server-secrets}}]
          readinessProbe: {tcpSocket: {port: grpc}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: grpc}, initialDelaySeconds: 10, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true}
---
apiVersion: v1
kind: Service
metadata: {name: tektalk-business-solutions}
spec: {selector: {app: tektalk-business-solutions}, ports: [{name: grpc, port: 50056, targetPort: grpc}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tektalk-server}
spec:
  replicas: 3
  selector: {matchLabels: {app: tektalk-server}}
  template:
    metadata: {labels: {app: tektalk-server}}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: server
          image: ghcr.io/tekxai/tektalk/server:latest
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{configMapRef: {name: tektalk-server-config}}, {secretRef: {name: tektalk-server-secrets}}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true}
---
apiVersion: v1
kind: Service
metadata: {name: tektalk-server}
spec: {selector: {app: tektalk-server}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: tektalk-server}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: tektalk-server}
  minReplicas: 3
  maxReplicas: 50
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: tektalk-server}
spec: {minAvailable: 2, selector: {matchLabels: {app: tektalk-server}}}

