apiVersion: v1
kind: ConfigMap
metadata: {name: chat-server-config}
data: {APP_BIND: "0.0.0.0:8080", RUST_LOG: "chat_server=info,tower_http=info"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: chat-server}
spec:
  replicas: 3
  selector: {matchLabels: {app: chat-server}}
  template:
    metadata: {labels: {app: chat-server}}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: server
          image: registry.example.vn/chat-server:0.1.0
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{configMapRef: {name: chat-server-config}}, {secretRef: {name: chat-server-secrets}}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true}
---
apiVersion: v1
kind: Service
metadata: {name: chat-server}
spec: {selector: {app: chat-server}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: chat-server}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: chat-server}
  minReplicas: 3
  maxReplicas: 50
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: chat-server}
spec: {minAvailable: 2, selector: {matchLabels: {app: chat-server}}}

