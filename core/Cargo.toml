[package]
name = "tektalk-client-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform TEKtalk client state and stable C ABI"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
aes = "0.8"
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
thiserror = "2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
