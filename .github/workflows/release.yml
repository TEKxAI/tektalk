name: release-images
on:
  push:
    tags: ["v*"]
permissions: {contents: read, packages: write}
jobs:
  images:
    strategy:
      matrix:
        include:
          - {name: server, dockerfile: Dockerfile}
          - {name: business-solutions, dockerfile: services/business-solutions/Dockerfile}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/metadata-action@v5
        id: meta
        with: {images: "ghcr.io/${{ github.repository }}/${{ matrix.name }}"}
      - uses: docker/build-push-action@v6
        with: {context: ., file: "${{ matrix.dockerfile }}", push: true, tags: "${{ steps.meta.outputs.tags }}", labels: "${{ steps.meta.outputs.labels }}"}

