name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - name: Lint gRPC contracts
        working-directory: contracts
        run: buf lint
      - name: Validate plugin manifests
        run: |
          jq --exit-status . plugins/plugin-manifest.schema.json >/dev/null
          for manifest in plugins/*/manifest.json; do jq --exit-status . "$manifest" >/dev/null; done
          ./scripts/validate-plugins.sh
      - name: Validate Rust client-core ABI surface
        run: ./scripts/check_layout.sh
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject legacy protocol references
        run: ./scripts/check_layout.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo clippy --workspace --all-targets
      - name: Build mobile client-core artifacts
        run: cargo build --release -p tektalk-client-core
      - name: Test with Rust coverage gate
        run: ./scripts/coverage/rust.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-coverage
          path: coverage/rust
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.10.2"}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Android Rust Core JNI libraries
        run: |
          cargo install cargo-ndk --locked
          bash scripts/build-core-android.sh
      - name: Test with Android coverage gate
        run: ./scripts/coverage/android.sh
      - run: gradle :app:assembleDebug
        working-directory: clients/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-coverage
          path: coverage/android
      - uses: actions/upload-artifact@v4
        with:
          name: tektalk-android-debug-apk
          path: clients/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  ios:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: clients/ios
      - name: Test with iOS coverage gate
        run: ./scripts/coverage/ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-coverage
          path: coverage/ios/xccov.json
      - name: Build iOS simulator application
        working-directory: clients/ios
        run: xcodebuild build -project TEKtalk.xcodeproj -scheme TEKtalk -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: tektalk-ios-simulator
          path: clients/ios/build/Build/Products/Debug-iphonesimulator/TEKtalk.app
          if-no-files-found: error
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build shared Rust Core
        run: bash scripts/build-core-macos.sh
      - name: Generate and test native macOS client
        working-directory: clients/macos
        run: |
          xcodegen generate
          xcodebuild test -project TEKtalkMac.xcodeproj -scheme TEKtalkMac -destination 'platform=macOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Build native macOS tab plugins
        run: bash scripts/build-desktop-plugins-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tektalk-macos-debug
          path: clients/macos/build/Build/Products/Debug/TEKtalkMac.app
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: tektalk-macos-plugins
          path: build/desktop-plugins/macos/*.dylib
          if-no-files-found: error
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: microsoft/setup-msbuild@v2
      - name: Test native Windows client logic
        shell: pwsh
        run: |
          cl /nologo /std:c++20 /EHsc clients/windows/TEKtalk.Windows.Tests/ClientLogicTests.cpp /Fe:ClientLogicTests.exe
          ./ClientLogicTests.exe
      - name: Build shared Rust Core
        shell: pwsh
        run: ./scripts/build-core-windows.ps1
      - name: Build C++ WinUI 3 application
        shell: pwsh
        run: msbuild clients/windows/TEKtalk.Windows/TEKtalk.Windows.vcxproj /restore /m /p:Configuration=Release /p:Platform=x64
      - name: Build native Windows tab plugins
        shell: pwsh
        run: ./scripts/build-desktop-plugins-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: tektalk-windows
          path: clients/windows/TEKtalk.Windows/x64/Release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: tektalk-windows-plugins
          path: plugins/desktop/windows/build/x64/Release/*.dll
          if-no-files-found: error
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local deployment files
        run: |
          sh -n scripts/local-up.sh scripts/local-down.sh scripts/smoke-test.sh
          cp .env.example .env
          docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., push: false, tags: tektalk-server:ci}
  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate CI-local configuration
        run: |
          cp .env.example .env
          sed -i "s/replace-with-at-least-32-random-bytes/$(openssl rand -hex 32)/" .env
          sed -i "s/replace-with-an-independent-random-secret/$(openssl rand -hex 32)/" .env
      - name: Start complete local stack
        run: docker compose up --build -d --wait --wait-timeout 600
      - name: Run API smoke test
        run: ./scripts/smoke-test.sh
      - name: Show service state and logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Stop local stack
        if: always()
        run: docker compose down --volumes --remove-orphans
