name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject legacy protocol references
        run: ./scripts/check_layout.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.10.2"}
      - run: gradle :app:assembleDebug
        working-directory: clients/android
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local deployment files
        run: |
          sh -n scripts/local-up.sh scripts/local-down.sh scripts/smoke-test.sh
          cp .env.example .env
          docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., push: false, tags: tektalk-server:ci}
  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate CI-local configuration
        run: |
          cp .env.example .env
          sed -i "s/replace-with-at-least-32-random-bytes/$(openssl rand -hex 32)/" .env
          sed -i "s/replace-with-an-independent-random-secret/$(openssl rand -hex 32)/" .env
      - name: Start complete local stack
        run: docker compose up --build -d --wait --wait-timeout 600
      - name: Run API smoke test
        run: ./scripts/smoke-test.sh
      - name: Show service state and logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Stop local stack
        if: always()
        run: docker compose down --volumes --remove-orphans
