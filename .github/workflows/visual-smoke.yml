name: Visual smoke
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths: ['clients/**', 'core/**', 'scripts/visual/**', '.github/workflows/visual-smoke.yml']
permissions: {contents: read}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env: {DATABASE_URL: 'postgres://chat@127.0.0.1:5432/chat'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {cache-on-failure: true}
      - uses: ankane/setup-postgres@v1
        with: {user: chat, database: chat}
      - run: cargo build --release -p chat-server
      - run: python3 scripts/visual/scenario.py backend
      - run: python3 scripts/visual/scenario.py prepare --platform web --fixture build/visual-fixtures/web.json
      - run: npm install --no-save playwright@1.55.1 && npx playwright install --with-deps chromium
      - name: Record registration, logout, login, verification, send, receive and reload
        run: node scripts/visual/record_web_mvp.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recording-web
          path: |
            recordings/web.webm
            recordings/*-backend.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: recording-web-diagnostics, path: 'recordings/*.log'}
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env: {DATABASE_URL: 'postgres://chat@127.0.0.1:5432/chat'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: x86_64-linux-android}
      - uses: Swatinem/rust-cache@v2
        with: {cache-on-failure: true}
      - uses: ankane/setup-postgres@v1
        with: {user: chat, database: chat}
      - run: cargo build --release -p chat-server
      - run: python3 scripts/visual/scenario.py backend
      - run: python3 scripts/visual/scenario.py prepare --platform android --fixture build/visual-fixtures/android.json
      - run: cargo install cargo-ndk --locked
      - run: cargo ndk -t x86_64 -o clients/android/app/src/main/jniLibs build --release -p tektalk-client-core
      - run: gradle -p clients/android :app:assembleDebug
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/visual/record_android_mvp.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recording-android
          path: |
            recordings/android.mp4
            recordings/android-*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: recording-android-diagnostics, path: 'recordings/*.log'}
  apple:
    strategy:
      fail-fast: false
      matrix: {platform: [ios, macos]}
    runs-on: macos-15
    timeout-minutes: 65
    env: {DATABASE_URL: 'postgres://chat@127.0.0.1:5432/chat'}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {cache-on-failure: true}
      - uses: ankane/setup-postgres@v1
        with: {user: chat, database: chat}
      - run: cargo build --release -p chat-server -p tektalk-client-core
      - run: bash scripts/build-core-macos.sh
      - run: python3 scripts/visual/scenario.py backend
      - name: Record complete ${{ matrix.platform }} UI flow
        run: bash scripts/visual/record_apple_mvp.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recording-${{ matrix.platform }}
          path: |
            recordings/ios.mp4
            recordings/macos.mp4
            recordings/ios-*.json
            recordings/macos-*.json
            recordings/ios-test.log
            recordings/macos-test.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: "recording-${{ matrix.platform }}-diagnostics", path: 'recordings/*.log'}
  windows:
    runs-on: windows-2022
    timeout-minutes: 65
    env: {DATABASE_URL: 'postgres://chat@127.0.0.1:5432/chat'}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {cache-on-failure: true}
      - uses: ankane/setup-postgres@v1
        with: {user: chat, database: chat}
      - run: cargo build --release -p chat-server -p tektalk-client-core
      - run: python scripts/visual/scenario.py backend
      - run: python scripts/visual/scenario.py prepare --platform windows --fixture build/visual-fixtures/windows.json
      - uses: microsoft/setup-msbuild@v2
      - run: Copy-Item target/release/tektalk_client_core.dll clients/windows/TEKtalk.Windows/tektalk_client_core.dll
      - run: msbuild clients/windows/TEKtalk.Windows/TEKtalk.Windows.vcxproj /restore /m /p:Configuration=Release /p:Platform=x64
      - run: choco install ffmpeg -y --no-progress
      - run: python -m pip install pywinauto==0.6.9
      - name: Record Windows registration, logout, login and bidirectional chat
        run: python scripts/visual/record_windows_mvp.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recording-windows
          path: |
            recordings/windows.mp4
            recordings/windows-*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: recording-windows-diagnostics
          path: |
            recordings/*.log
            recordings/windows-ui.txt
  videos:
    needs: [web, android, apple, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: 'recording-*', path: recordings, merge-multiple: true}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python3 scripts/visual/package_recordings.py recordings
      - uses: actions/upload-artifact@v4
        with:
          name: tektalk-mvp-screen-recordings
          path: |
            recordings/published/*.mp4
            recordings/published/recording-manifest.json
            recordings/*-flow.json
            recordings/*-backend.json
          if-no-files-found: error
