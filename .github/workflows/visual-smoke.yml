name: Visual smoke
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "clients/**"
      - "core/**"
      - "scripts/visual/**"
      - ".github/workflows/visual-smoke.yml"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Start real backend stack
        run: |
          cp .env.example .env
          sed -i "s/replace-with-at-least-32-random-bytes/$(openssl rand -hex 32)/" .env
          sed -i "s/replace-with-an-independent-random-secret/$(openssl rand -hex 32)/" .env
          docker compose up --build -d --wait --wait-timeout 600
      - run: npm install --no-save playwright@1.55.1 && npx playwright install --with-deps chromium
      - run: python3 -m http.server 5173 --directory clients/web >/tmp/tektalk-web.log 2>&1 &
      - name: Capture register, login, verification and chat MVP
        run: mkdir -p screenshots && node scripts/visual/capture_web_mvp.mjs
      - uses: actions/upload-artifact@v4
        with: {name: visual-web, path: screenshots/*.png, if-no-files-found: error}
      - name: Show backend logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop backend stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: x86_64-linux-android}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.10.2"}
      - run: cargo install cargo-ndk --locked
      - run: cargo ndk -t x86_64 -o clients/android/app/src/main/jniLibs build --release -p tektalk-client-core
      - name: Enable emulator acceleration
        run: |
          sudo chmod 666 /dev/kvm
      - name: Build Android client before starting the emulator
        run: gradle -p clients/android :app:assembleDebug
      - name: Build, boot and capture Android client
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/visual/capture_android.sh
      - name: Upload Android diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with: {name: android-visual-diagnostics, path: screenshots/android-*.txt}
      - uses: actions/upload-artifact@v4
        with: {name: visual-android, path: screenshots/*.png, if-no-files-found: error}

  apple:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install xcodegen
      - name: Build macOS shared Rust core
        run: bash scripts/build-core-macos.sh
      - name: Build and capture iOS client
        run: |
          set -euo pipefail
          mkdir -p screenshots
          cd clients/ios
          xcodegen generate
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for xs in d.values() for x in xs if x["name"].startswith("iPhone") and x["isAvailable"]))')
          xcrun simctl boot "$UDID" || true
          open -a Simulator
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild -project TEKtalk.xcodeproj -scheme TEKtalk -configuration Debug -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build build CODE_SIGNING_ALLOWED=NO
          APP=$(find build/Build/Products -path '*iphonesimulator/TEKtalk.app' -print -quit)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" vn.tektalk.ios
          sleep 5
          xcrun simctl io "$UDID" screenshot ../../screenshots/ios.png
      - name: Build and capture macOS client
        run: |
          set -euo pipefail
          cd clients/macos
          xcodegen generate
          xcodebuild -project TEKtalkMac.xcodeproj -scheme TEKtalkMac -configuration Debug -derivedDataPath build build CODE_SIGNING_ALLOWED=NO
          APP=$(find build/Build/Products -path '*/TEKtalkMac.app' -print -quit)
          open "$APP"
          sleep 5
          screencapture -x ../../screenshots/macos.png
      - uses: actions/upload-artifact@v4
        with: {name: visual-apple, path: screenshots/*.png, if-no-files-found: error}

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p tektalk-client-core
      - name: Prepare Rust core
        shell: pwsh
        run: Copy-Item target/release/tektalk_client_core.dll clients/windows/TEKtalk.Windows/tektalk_client_core.dll
      - uses: microsoft/setup-msbuild@v2
      - name: Build Windows client
        shell: pwsh
        run: msbuild clients/windows/TEKtalk.Windows/TEKtalk.Windows.vcxproj /restore /m /p:Configuration=Release /p:Platform=x64
      - name: Launch and capture Windows client
        shell: pwsh
        run: |
          $exe = Get-ChildItem clients/windows -Recurse -Filter TEKtalk.exe | Where-Object FullName -Match 'Release' | Select-Object -First 1
          if (-not $exe) { throw 'TEKtalk.exe was not produced' }
          $process = Start-Process $exe.FullName -PassThru
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            Start-Sleep -Milliseconds 500
            $process.Refresh()
            if ($process.HasExited) { throw "TEKtalk.exe exited with code $($process.ExitCode)" }
            if ($process.MainWindowHandle -ne 0) { break }
          }
          if ($process.MainWindowHandle -eq 0) { throw 'TEKtalk window was not created' }
          New-Item -ItemType Directory -Force screenshots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeWindow {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int command);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          '@
          [NativeWindow]::ShowWindow($process.MainWindowHandle, 9) | Out-Null
          [NativeWindow]::SetForegroundWindow($process.MainWindowHandle) | Out-Null
          Start-Sleep -Seconds 2
          $rect = New-Object NativeWindow+RECT
          if (-not [NativeWindow]::GetWindowRect($process.MainWindowHandle, [ref]$rect)) { throw 'Could not read TEKtalk window bounds' }
          $width = $rect.Right - $rect.Left
          $height = $rect.Bottom - $rect.Top
          if ($width -lt 320 -or $height -lt 240) { throw "Invalid TEKtalk window size: ${width}x${height}" }
          $image = New-Object System.Drawing.Bitmap $width, $height
          $graphics = [System.Drawing.Graphics]::FromImage($image)
          $graphics.CopyFromScreen((New-Object System.Drawing.Point $rect.Left, $rect.Top), [System.Drawing.Point]::Empty, (New-Object System.Drawing.Size $width, $height))
          $image.Save((Join-Path $PWD 'screenshots/windows.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose(); $image.Dispose()
      - uses: actions/upload-artifact@v4
        with: {name: visual-windows, path: screenshots/*.png, if-no-files-found: error}

  gif:
    needs: [web, android, apple, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: visual-*, path: screenshots, merge-multiple: true}
      - run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - run: python3 scripts/visual/make_platform_gif.py screenshots tektalk-platform-demo.gif
      - uses: actions/upload-artifact@v4
        with:
          name: tektalk-platform-demo
          path: |
            tektalk-platform-demo.gif
            screenshots/*.png
