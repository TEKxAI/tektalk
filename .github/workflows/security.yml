name: security
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push: {branches: [main]}
  pull_request:
  schedule: [{cron: "17 2 * * 1"}]
  workflow_dispatch:
  workflow_call:
permissions: {contents: read}
jobs:
  quality-start:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: {contents: read, statuses: write}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ci/publish-status.py quality-gate/security
        env: {GITHUB_TOKEN: '${{ github.token }}'}
  quality-result:
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality-start, dependencies, filesystem, secrets]
    runs-on: ubuntu-latest
    permissions: {contents: read, statuses: write}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ci/publish-status.py quality-gate/security
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUALITY_RESULTS: ${{ toJSON(needs) }}
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate dependency lockfile
        run: cargo generate-lockfile
      - uses: taiki-e/install-action@v2
        with: {tool: "cargo-audit@0.22.2"}
      - name: Audit dependencies and fail on vulnerabilities on every trigger
        run: cargo audit --ignore RUSTSEC-2023-0071
  filesystem:
    permissions: {contents: read, security-events: write}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v3
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' }}
        with: {sarif_file: trivy-results.sarif}
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install pinned Gitleaks with release checksum verification
        run: bash scripts/ci/install-gitleaks.sh
      - name: Verify secret detection and narrow historical exceptions
        run: python3 scripts/ci/test-secret-scan.py
      - name: Scan all Git history on every trigger
        run: gitleaks git --redact --log-opts="--full-history --all" --report-format=sarif --report-path=gitleaks-results.sarif .
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('gitleaks-results.sarif') != '' }}
        with:
          name: gitleaks-results
          path: gitleaks-results.sarif
          if-no-files-found: error

