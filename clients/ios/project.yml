name: TEKtalk
options: {bundleIdPrefix: vn.tektalk, deploymentTarget: {iOS: "16.0"}}
targets:
  TEKtalk:
    type: application
    platform: iOS
    sources: [TEKtalk]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.tektalk.ios
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: true
  TEKtalkTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TEKtalkTests]
    dependencies:
      - target: TEKtalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.tektalk.ios.tests
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TEKtalk:
    build:
      targets:
        TEKtalk: all
        TEKtalkTests: [test]
    test:
      targets: [TEKtalkTests]
