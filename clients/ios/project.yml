name: TEKtalk
options: {bundleIdPrefix: vn.tektalk, deploymentTarget: {iOS: "16.0"}}
targets:
  TEKtalk:
    type: application
    platform: iOS
    sources: [TEKtalk]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.tektalk.ios
        CODE_SIGN_ENTITLEMENTS: TEKtalk/TEKtalk.entitlements
        # Named color catalogs do not define an application icon set.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: true
        INFOPLIST_KEY_CFBundleURLTypes: '[{"CFBundleURLSchemes":["tektalk"]}]'
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/RustCore"
        OTHER_LDFLAGS: "$(inherited) -ltektalk_client_core -framework Security"
    preBuildScripts:
      - name: Build shared Rust Core
        script: |
          set -eu
          ROOT="$SRCROOT/../.."
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then
            case " $ARCHS " in
              *" arm64 "*) TARGET="aarch64-apple-ios-sim" ;;
              *) TARGET="x86_64-apple-ios" ;;
            esac
          else
            TARGET="aarch64-apple-ios"
          fi
          rustup target add "$TARGET"
          cargo build --manifest-path "$ROOT/Cargo.toml" --release -p tektalk-client-core --target "$TARGET"
          mkdir -p "$SRCROOT/RustCore"
          cp "$ROOT/target/$TARGET/release/libtektalk_client_core.a" "$SRCROOT/RustCore/"
  TEKtalkTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TEKtalkTests]
    dependencies:
      - target: TEKtalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.tektalk.ios.tests
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
  TEKtalkFlowTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - ../../scripts/visual/apple/MVPFlowTests.swift
    - TEKtalkFlowTests
    dependencies:
    - target: TEKtalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.tektalk.ios.flowtests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: '5.10'
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: true
        TEST_TARGET_NAME: TEKtalk
schemes:
  TEKtalk:
    build:
      targets:
        TEKtalk: all
        TEKtalkTests: [test]
    test:
      targets: [TEKtalkTests]
  TEKtalkMVP:
    build:
      targets:
        TEKtalk: all
        TEKtalkFlowTests:
        - test
    test:
      targets:
      - TEKtalkFlowTests
