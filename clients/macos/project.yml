name: TEKtalkMac
options:
  bundleIdPrefix: vn.tektalk
  deploymentTarget:
    macOS: "14.0"
targets:
  TEKtalkMac:
    type: application
    platform: macOS
    sources: [TEKtalkMac]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.tektalk.macos
        # Named color catalogs do not define an application icon set.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: true
        OTHER_LDFLAGS: "$(inherited) -framework Security"
    postBuildScripts:
      - name: Embed Rust Core
        script: |
          set -eu
          SOURCE="$SRCROOT/Frameworks/libtektalk_client_core.dylib"
          if [ -f "$SOURCE" ]; then
            mkdir -p "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
            cp "$SOURCE" "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/"
          fi
  TEKtalkMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [TEKtalkMacTests]
    dependencies:
      - target: TEKtalkMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.tektalk.macos.tests
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
  TEKtalkMacFlowTests:
    type: bundle.ui-testing
    platform: macOS
    sources:
    - ../../scripts/visual/apple/MVPFlowTests.swift
    - TEKtalkMacFlowTests
    dependencies:
    - target: TEKtalkMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.tektalk.macos.flowtests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: '5.10'
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: true
        TEST_TARGET_NAME: TEKtalkMac
schemes:
  TEKtalkMac:
    build:
      targets:
        TEKtalkMac: all
        TEKtalkMacTests: [test]
    test:
      targets: [TEKtalkMacTests]
  TEKtalkMacMVP:
    build:
      targets:
        TEKtalkMac: all
        TEKtalkMacFlowTests:
        - test
    test:
      targets:
      - TEKtalkMacFlowTests
