<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0089ff">
  <title>TEKtalk Web</title>
  <link rel="stylesheet" href="./design-tokens.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- Auth is the initial screen even before JavaScript loads. No app behind it. -->
  <main id="authDialog" class="auth-view">
    <aside class="auth-brand">
      <div><h1>TEKtalk</h1><p data-i18n="authHero">Nhắn tin trên mọi thiết bị</p></div>
      <span id="connection" class="connection" role="status"><i></i><span data-i18n="connecting">Đang kết nối</span></span>
    </aside>
    <div class="auth-content">
      <div id="authPreferences"><div id="preferences" class="preferences">
        <button id="languageButton" class="secondary" type="button" data-i18n-aria="changeLanguage" aria-label="Đổi ngôn ngữ">VI</button>
        <button id="themeButton" class="secondary" type="button" data-i18n-aria="changeTheme" aria-label="Đổi giao diện">◐</button>
      </div></div>
      <form id="authForm" class="auth-card">
        <h2 id="authTitle" data-i18n="login">Đăng nhập</h2>
        <p id="authIntro" data-i18n="authIntro">Đăng nhập để tiếp tục vào TEKtalk.</p>
        <fieldset id="authCredentials">
          <label><span data-i18n="phone">Số điện thoại</span><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+84" pattern="\+[1-9][0-9]{7,14}" required></label>
          <label id="displayNameField" hidden><span data-i18n="displayName">Tên hiển thị</span><input name="display_name" autocomplete="name" disabled></label>
          <label><span data-i18n="password">Mật khẩu</span><input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
          <label id="questionField" hidden><span data-i18n="securityQuestion">Câu hỏi bảo mật</span><input name="security_question" disabled></label>
          <label id="answerField" hidden><span data-i18n="securityAnswer">Câu trả lời</span><input name="security_answer" type="password" autocomplete="off" disabled></label>
        </fieldset>
        <label id="challengeField" hidden><span id="challengeQuestion" data-i18n="securityAnswer">Câu trả lời</span><input name="challenge_answer" type="password" autocomplete="off" disabled></label>
        <div id="authError" class="form-error" role="alert"></div>
        <button id="authSubmit" class="primary" type="submit" data-i18n="login">Đăng nhập</button>
        <div class="auth-switch">
          <button type="button" data-auth-mode="register" data-i18n="switchToRegister">Chưa có tài khoản? Đăng ký</button>
          <button type="button" data-auth-mode="login" data-i18n="switchToLogin" hidden>Đã có tài khoản? Đăng nhập</button>
        </div>
      </form>
    </div>
  </main>
  <div id="appShell" class="shell" hidden inert>
    <main class="workspace">
      <aside class="sidebar">
        <h1 class="brand">TEKtalk</h1>
        <div class="sidebar-content">
          <section class="sidebar-page active" data-sidebar="messages"><h2 data-i18n="messages">Tin nhắn</h2><div class="conversation-list"></div></section>
          <section class="sidebar-page" data-sidebar="ai"><h2>AI</h2><p data-i18n="aiBody"></p></section>
          <section class="sidebar-page" data-sidebar="me"><h2 data-i18n="me">Cá nhân</h2><p id="sidebarUserId" class="identifier"></p></section>
        </div>
        <nav class="rail" aria-label="Main navigation">
          <button class="nav-item active" type="button" data-tab="messages"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-5 4v-4a2 2 0 0 1-1-2V5a2 2 0 0 1 2-2Z"/></svg><span data-i18n="messages">Tin nhắn</span></button>
          <button class="nav-item" type="button" data-tab="ai"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 1 3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/></svg><span>AI</span></button>
          <button class="nav-item" type="button" data-tab="me"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="5"/><path d="M2 22c0-11 20-11 20 0Z"/></svg><span data-i18n="me">Cá nhân</span></button>
        </nav>
      </aside>
      <section id="messages" class="tab-panel active">
        <article class="chat-panel">
          <header class="chat-header"><div><h2 data-i18n="messages">Tin nhắn</h2><p id="chatStatus" role="status" data-i18n="startChat"></p></div><button id="syncHistory" class="secondary" type="submit" form="chatForm" data-i18n="syncHistory">Đồng bộ tin nhắn</button></header>
          <div id="chatControls"><form id="chatForm" class="chat-controls">
            <label><span data-i18n="conversationId">ID cuộc trò chuyện</span><input id="conversationId" autocomplete="off" required></label>
            <label><span data-i18n="recipientId">ID người nhận</span><input id="recipientId" autocomplete="off" required></label>
          </form></div>
          <div id="messageList" class="message-list" aria-live="polite"></div>
          <form id="messageForm" class="composer">
            <textarea id="messageInput" rows="1" maxlength="16384" data-i18n-placeholder="typeMessage" data-i18n-aria="typeMessage" aria-label="Nhập tin nhắn" placeholder="Nhập tin nhắn"></textarea>
            <button id="sendButton" class="primary send" type="submit" data-i18n="send" disabled>Gửi</button>
          </form>
        </article>
      </section>
      <section id="ai" class="tab-panel feature-panel"><div class="empty-feature"><svg class="feature-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 1 3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/></svg><h2>TEK AI</h2><p data-i18n="aiBody"></p></div></section>
      <section id="me" class="tab-panel profile-panel">
        <h2 data-i18n="me">Cá nhân</h2>
        <div class="profile-card"><h3>Core Platform</h3><dl>
          <div><dt data-i18n="user">Người dùng</dt><dd id="profileId" class="identifier"></dd></div>
          <div><dt data-i18n="device">Thiết bị</dt><dd id="deviceId" class="identifier"></dd></div>
          <div><dt data-i18n="connectionStatus">Kết nối</dt><dd id="coreStatus"></dd></div>
        </dl><button id="signOutButton" class="secondary" type="button" data-i18n="signOut">Đăng xuất</button></div>
        <div class="profile-card"><h3 data-i18n="appearance">Giao diện</h3><div id="sessionPreferences"></div></div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="./encrypted-storage.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
