syntax = "proto3";

package tektalk.v1;

import "tektalk/v1/common.proto";

service PluginRegistryService {
  rpc ResolvePluginSet(ResolvePluginSetRequest) returns (ResolvePluginSetResponse);
  rpc ReportPluginHealth(ReportPluginHealthRequest) returns (ReportPluginHealthResponse);
  rpc ResolveMiniApps(ResolveMiniAppsRequest) returns (ResolveMiniAppsResponse);
}

message ResolvePluginSetRequest {
  RequestContext context = 1;
  string platform = 2;
  string architecture = 3;
  string host_version = 4;
  string locale = 5;
  uint32 core_abi = 6;
  string valdi_runtime = 7;
  string device_id = 8;
}

message PluginDescriptor {
  string id = 1;
  string version = 2;
  string entry_point = 3;
  string module_url = 4;
  bytes sha256 = 5;
  bytes signature = 6;
  string minimum_host_version = 7;
  repeated string capabilities = 8;
  uint32 tab_order = 9;
  bool required = 10;
  uint32 minimum_core_abi = 11;
  string valdi_runtime = 12;
  string plugin_type = 13;
  string storage_namespace = 14;
  repeated string network_allowlist = 15;
  string signing_key_id = 16;
  repeated PluginArtifact artifacts = 17;
}

message PluginArtifact {
  string platform = 1;
  string architecture = 2;
  string runtime = 3;
  string artifact_kind = 4;
  string url = 5;
  bytes sha256 = 6;
  bytes signature = 7;
  string signing_key_id = 8;
}

message ResolvePluginSetResponse {
  string catalog_version = 1;
  repeated PluginDescriptor plugins = 2;
  bytes catalog_signature = 3;
  int64 expires_at_unix_ms = 4;
  bytes signed_catalog = 5;
  string signing_key_id = 6;
}

message ReportPluginHealthRequest {
  RequestContext context = 1;
  string plugin_id = 2;
  string plugin_version = 3;
  string state = 4;
  string failure_code = 5;
}

message ReportPluginHealthResponse {
  bool accepted = 1;
}

message ResolveMiniAppsRequest {
  RequestContext context = 1;
  string platform = 2;
  string host_version = 3;
  uint32 core_abi = 4;
  string valdi_runtime = 5;
}

message ResolveMiniAppsResponse {
  repeated PluginDescriptor mini_apps = 1;
  string catalog_version = 2;
  bytes signed_catalog = 3;
  bytes catalog_signature = 4;
  string signing_key_id = 5;
  int64 expires_at_unix_ms = 6;
}
