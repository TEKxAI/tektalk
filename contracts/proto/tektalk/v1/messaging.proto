syntax = "proto3";

package tektalk.v1;

import "tektalk/v1/common.proto";

service MessageService {
  rpc CommitMessage(CommitMessageRequest) returns (CommitMessageResponse);
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);
}

message CommitMessageRequest {
  RequestContext context = 1;
  string conversation_id = 2;
  string recipient_id = 3;
  string client_message_id = 4;
  bytes body = 5;
}

message CommitMessageResponse {
  string client_message_id = 1;
  int64 server_message_id = 2;
  int64 committed_at_unix_ms = 3;
}

message GetHistoryRequest {
  RequestContext context = 1;
  string conversation_id = 2;
  int64 before_message_id = 3;
  uint32 limit = 4;
}

message StoredMessage {
  int64 server_message_id = 1;
  string sender_id = 2;
  bytes body = 3;
  int64 committed_at_unix_ms = 4;
}

message GetHistoryResponse {
  repeated StoredMessage messages = 1;
  int64 next_before_message_id = 2;
}
