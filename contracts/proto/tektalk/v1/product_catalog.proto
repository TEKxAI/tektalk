syntax = "proto3";

package tektalk.v1;

enum CustomerSegment {
  CUSTOMER_SEGMENT_UNSPECIFIED = 0;
  CUSTOMER_SEGMENT_USER = 1;
  CUSTOMER_SEGMENT_ENTERPRISE = 2;
}

message ProductPlan {
  string code = 1;
  CustomerSegment segment = 2;
  string display_name = 3;
  string currency = 4;
  uint64 price_minor_units = 5;
  repeated string entitlement_keys = 6;
  bool active = 7;
}

message ListPlansRequest {
  CustomerSegment segment = 1;
}

message ListPlansResponse {
  repeated ProductPlan plans = 1;
}

message ResolveEntitlementsRequest {
  string subject_id = 1;
  CustomerSegment subject_segment = 2;
  string plan_code = 3;
}

message ResolveEntitlementsResponse {
  repeated string entitlement_keys = 1;
}

service ProductCatalogService {
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  rpc ResolveEntitlements(ResolveEntitlementsRequest) returns (ResolveEntitlementsResponse);
}

enum SubscriptionStatus {
  SUBSCRIPTION_STATUS_UNSPECIFIED = 0;
  SUBSCRIPTION_STATUS_ACTIVE = 1;
  SUBSCRIPTION_STATUS_CANCELLED = 2;
}

message Subscription {
  string id = 1;
  string subject_id = 2;
  CustomerSegment subject_segment = 3;
  string plan_code = 4;
  SubscriptionStatus status = 5;
}

message ActivateRequest {
  string subject_id = 1;
  CustomerSegment subject_segment = 2;
  string plan_code = 3;
}

message CancelRequest {
  string subject_id = 1;
  CustomerSegment subject_segment = 2;
}

message GetEntitlementsRequest {
  string subject_id = 1;
  CustomerSegment subject_segment = 2;
}

message ActivateResponse {
  Subscription subscription = 1;
}

message CancelResponse {
  Subscription subscription = 1;
}

message GetEntitlementsResponse {
  repeated string entitlement_keys = 1;
}

service SubscriptionService {
  rpc Activate(ActivateRequest) returns (ActivateResponse);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc GetEntitlements(GetEntitlementsRequest) returns (GetEntitlementsResponse);
}
