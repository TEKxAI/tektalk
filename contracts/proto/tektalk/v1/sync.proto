syntax = "proto3";

package tektalk.v1;

import "tektalk/v1/common.proto";

service SyncService {
  rpc GetDifference(GetDifferenceRequest) returns (GetDifferenceResponse);
  rpc AcknowledgeCursor(AcknowledgeCursorRequest) returns (AcknowledgeCursorResponse);
}

message GetDifferenceRequest {
  RequestContext context = 1;
  string cursor = 2;
  uint32 limit = 3;
}

message Update {
  string update_id = 1;
  string kind = 2;
  bytes payload = 3;
}

message GetDifferenceResponse {
  repeated Update updates = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message AcknowledgeCursorRequest {
  RequestContext context = 1;
  string cursor = 2;
}

message AcknowledgeCursorResponse {
  bool accepted = 1;
}
